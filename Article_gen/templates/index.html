<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Autodialer AI</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container py-5">
    <h1 class="mb-4 text-center">📞 Autodialer AI</h1>

    <!-- Upload Numbers -->
    <div class="card mb-4">
      <div class="card-header">Upload or Paste Numbers</div>
      <div class="card-body">
        <form method="POST">
          <textarea name="numbers" class="form-control mb-3" rows="6" placeholder="Paste 1800 numbers here (one per line)"></textarea>
          <button type="submit" class="btn btn-primary">Call All</button>
        </form>
      </div>
    </div>

    <!-- AI Prompt -->
    <div class="card mb-4">
      <div class="card-header">AI Prompt</div>
      <div class="card-body">
        <form action="/prompt" method="POST" class="d-flex gap-2">
          <input type="text" name="prompt" class="form-control" placeholder="e.g. Call 18001234567">
          <button type="submit" class="btn btn-success">Submit</button>
        </form>
      </div>
    </div>

    <!-- Call Log -->
    <div class="card">
      <div class="card-header">Call Log</div>
      <div class="card-body">
        <a href="/log" class="btn btn-outline-secondary">View Log</a>
      </div>
    </div>
  </div>
</body>
</html>
