<!DOCTYPE html>
<html>
<head>
  <title>AI Blog Generator</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-5">
  <h1 class="mb-4">📝 AI-Generated Blog</h1>

  <form action="/generate_blog" method="POST" class="mb-4">
    <textarea name="titles" class="form-control" rows="6" placeholder="Enter blog titles, one per line"></textarea>
    <button type="submit" class="btn btn-primary mt-2">Generate Articles</button>
  </form>

  {% for title, content in posts %}
    <div class="card mb-4">
      <div class="card-header"><strong>{{ title }}</strong></div>
      <div class="card-body"><p>{{ content|safe }}</p></div>
    </div>
  {% endfor %}
</body>
</html>
